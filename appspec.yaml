version: 0.0
os: linux
files:
  - source: target/my-webapp-1.0.war
    destination: /usr/local/tomcat9/webapps/
hooks:
  BeforeInstall:
    - location: scripts/stop_server.sh
      timeout: 300
      runas: root
  AfterInstall:
    - location: scripts/fix_permissions.sh
      timeout: 300
      runas: root
  ApplicationStart:
    - location: scripts/start_server.sh
      timeout: 300
      runas: root
